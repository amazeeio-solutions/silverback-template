services:
  remote_page.xmlsitemap_source:
    class: Drupal\remote_page\XMLSitemap\XMLSitemapSource
  remote_page.cleanup:
    class: Drupal\remote_page\Cleanup
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@queue'
  remote_page.sync:
    class: Drupal\remote_page\RemotePageSync
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@date.formatter'
      - '@datetime.time'
