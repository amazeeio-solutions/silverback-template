"""
implementation(drupal): custom.mcp::createPage
"""
directive @createPage(input: String!) on FIELD_DEFINITION

"""
implementation(drupal): custom.mcp::updatePage
"""
directive @updatePage(input: String!) on FIELD_DEFINITION

"""
The path segment of a url, with a leading slash.
"""
scalar Path @default @value(string: "/")

"""
HTML-formatted text
"""
scalar Markup @default @value(string: "")

type Query {
  """
  Retrieve the currently logged in user.
  """
  currentUser: User @currentUser

  """
  Search for pages. The "args" parameter accepts url-encoded arguments.
  The only valid argument is "search", which will perform a text search.
  Example: `search=Drupal`
  """
  listPages(args: String): [Page]!
    @drupalView(id: "mcp_pages:default", args: "$args")
    @prop(key: "rows")
}

type Mutation {
  """
  Create a new page at a given path.
  """
  createPage(input: PageInput!): PageOperationResult!
    @createPage(input: "$input")

  """
  Update the page at a given path.
  The path argument is used to identify the page to update.
  """
  updatePage(input: PageInput!): PageOperationResult!
    @arg(name: "input")
    @prop(key: "path")
    @route(path: "$")
    @updatePage(input: "$input")
}

type PageOperationResult @default @value {
  success: Boolean!
  page: Page @prop(key: "entity")
  errors: [String!]
}

"""
A system user.
"""
type User {
  name: String! @entityLabel
}

type Page @default @value {
  """
  The path a page is accessible at.
  """
  path: Path! @entityPath

  """
  The pages title.
  """
  title: String! @entityLabel

  """
  A list of content segments this page consists of.
  """
  content: [Content]!
    @lang
    @resolveEditorBlocks(path: "body.value", ignored: ["core/group"])
    @seek(pos: 1)
    @resolveEditorBlockChildren
}

input PageInput {
  path: Path!
  title: String!
  """
  A list of blocks that make up the page content.
  Each block should contain only one block level element.
  For multiple paragraphs, there should be multiple instances in this field.
  """
  content: [ContentInput]
}

union Content @resolveEditorBlockType = FormattedText | Heading

input ContentInput {
  FormattedText: FormattedTextInput
  Heading: HeadingInput
}

"""
A single paragraph of formatted text.
Each block should only contain one block level element like <h2>, <p>, <ul> or <ol>.
"""
type FormattedText @type(id: "core/paragraph") {
  """
  The paragraph's content as HTML markup.
  It has to consist of a single root block level element.
  """
  html: Markup! @resolveEditorBlockMarkup
}

input FormattedTextInput {
  html: Markup!
}

"""
Block type displaying a heading of a given level.
Levels 2, 3 and 4 are allowed.
"""
type Heading @type(id: "custom/heading") {
  level: Int
  text: String
}

input HeadingInput {
  level: Int!
  text: String!
}
