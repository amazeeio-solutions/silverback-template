chat_ui.settings:
  path: "/admin/config/system/chat-ai/ui"
  defaults:
    _title: "Chat UI"
    _form: 'Drupal\chat_ui\Form\ChatUISettingsForm'
  requirements:
    _permission: "administer chat_ai configuration"

chat_ui.serve.js:
  path: "/chat-ui.js"
  defaults:
    _title: "Chat UI JS"
    _controller: '\Drupal\chat_ui\Controller\ChatUiJs::serve'
  requirements:
    _permission: "access content"
