services:
  custom.route_subscriber:
    class: Drupal\custom\Routing\RouteSubscriber
    tags:
      - { name: event_subscriber }

  custom.webform:
    class: Drupal\custom\Webform
    arguments: ['@renderer', '@entity_type.manager', '@serializer']

  custom.menus:
    class: Drupal\custom\Menus

  custom.content_moderation:
    class: Drupal\custom\ContentModeration
    arguments: ['@content_moderation.moderation_information', '@content_moderation.state_transition_validation', '@current_user', '@access_check.silverback_preview_link', '@account_switcher']

  custom.entity_language_redirect_subscriber:
    class: Drupal\custom\EventSubscriber\EntityLanguageRedirectSubscriber
    arguments: ['@language_manager', '@current_route_match']
    tags:
      - { name: event_subscriber }

  custom.event_subscriber:
    class: Drupal\custom\EventSubscriber\RobotsSubscriber
    tags:
      - { name: event_subscriber }
