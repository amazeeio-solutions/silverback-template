fragment Product on Product {
  id
  uuid
  locale
  path
  editLink {
    url
    type
  }
  translations {
    locale
    path
  }
  title
  teaserImage {
    source(width: 600, height: 600, sizes: [[400, 400], [600, 600], [800, 800]])
    alt
  }
  hero {
    headline
    lead
    image {
      portrait: source(width: 1200, height: 2400)
      landscape: source(
        width: 2000
        height: 500
        sizes: [
          [800, 800]
          [1200, 200]
          [1600, 1600]
          [2000, 2000]
          [2800, 2800]
        ]
      )
      alt
    }
    ctaText
    ctaUrl
    formUrl
  }
  description
  price
  sku
  stock
  metaTags {
    tag
    attributes {
      name
      content
      property
      rel
      href
    }
  }
  terms {
    ...TermContentHub
  }
}
