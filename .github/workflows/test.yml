name: Test
on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      turborepo_caching:
        description: 'Turborepo caching'
        type: choice
        options:
          - 'On'
          - 'Off'
        default: 'On'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Init check
        if: github.repository != 'amazeeio-solutions/silverback-template'
        run:
          echo 'Please run the INIT script. See the root README.md for
          instructions.' && false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: TurboRepo local server
        if: github.event.inputs.turborepo_caching != 'Off'
        uses: felixmosh/turborepo-gh-artifacts@v3
        with:
          server-token: 'local'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if Drupal content export is up to date
        run: |
          set -ex
          cd apps/cms
          pnpm turbo prep
          pnpm content:export
          if [[ $(git status --porcelain ../../packages/drupal/test_content/content) ]]; then
            echo "Error: Content export is not up to date"
            echo "Please run 'pnpm content:export' from apps/cms and commit the changes"
            echo "Detected changes:"
            git status --porcelain ../../packages/drupal/test_content/content
            echo "Diff:"
            git diff ../../packages/drupal/test_content/content
            exit 1
          fi
        env:
          TURBO_API: 'http://127.0.0.1:9080'
          TURBO_TOKEN: 'local'
          TURBO_TEAM: 'local'

      - name: Precommit to catch early errors
        run: pnpm precommit
        env:
          TURBO_API: 'http://127.0.0.1:9080'
          TURBO_TOKEN: 'local'
          TURBO_TEAM: 'local'

      - name: Verify precommit did not change anything
        run: |
          set -ex
          if [[ $(git status --porcelain .) ]]; then
            echo "Error: Formatting changes found. Run 'pnpm precommit' before committing"
            echo "Detected changes:"
            git status --porcelain .
            echo "Diff:"
            git diff .
            exit 1
          fi

      - name: Test
        run: pnpm turbo:test
        env:
          TURBO_API: 'http://127.0.0.1:9080'
          TURBO_TOKEN: 'local'
          TURBO_TEAM: 'local'

      - name: 'Logs: cms'
        run: cat /tmp/cms.log || true
        if: always()
      - name: 'Logs: website'
        run: cat /tmp/website.log || true
        if: always()
      - name: 'Logs: preview'
        run: cat /tmp/preview.log || true
        if: always()

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 3

      # Temporarily disabled due to Chromatic account update.
      # - name: Check for Chromatic project token
      #   id: chromatic-check
