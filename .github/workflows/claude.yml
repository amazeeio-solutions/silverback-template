name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # For PR-related events, check out the PR head; otherwise use default
          ref:
            ${{ (github.event_name == 'pull_request_review_comment' ||
            github.event_name == 'pull_request_review') &&
            github.event.pull_request.head.sha || github.sha }}

      - name: Checkout PR branch for issue comments on PRs
        if:
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request
        run: |
          # Get PR details and checkout the PR branch
          PR_NUMBER=$(echo "${{ github.event.issue.pull_request.url }}" | grep -o '[0-9]*$')
          PR_DATA=$(gh pr view $PR_NUMBER --json headRefName,headRepository)
          HEAD_REF=$(echo "$PR_DATA" | jq -r '.headRefName')
          HEAD_REPO=$(echo "$PR_DATA" | jq -r '.headRepository.owner.login + "/" + .headRepository.name')

          if [[ "$HEAD_REPO" != "${{ github.repository }}" ]]; then
            # For forks, add the fork as a remote and fetch
            git remote add fork "https://github.com/$HEAD_REPO.git"
            git fetch fork "$HEAD_REF"
            git checkout "fork/$HEAD_REF"
          else
            # For same repo, just checkout the branch
            git fetch origin "$HEAD_REF"
            git checkout "$HEAD_REF"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Optional: Specify model (defaults to Claude Sonnet 4, uncomment for Claude Opus 4)
          # model: "claude-opus-4-20250514"

          # Optional: Customize the trigger phrase (default: @claude)
          # trigger_phrase: "/claude"

          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "claude-bot"

          # Optional: Allow Claude to run specific commands
          # allowed_tools: "Bash(npm install),Bash(npm run build),Bash(npm run test:*),Bash(npm run lint:*)"

          # Optional: Add custom instructions for Claude to customize its behavior for your project
          # custom_instructions: |
          #   Follow our coding standards
          #   Ensure all new code has tests
          #   Use TypeScript for new files

          # Optional: Custom environment variables for Claude
          # claude_env: |
          #   NODE_ENV: test
