name: 'Setup'
description: 'Common setup steps for GitHub Actions'
runs:
  using: 'composite'
  steps:
    - name: Install devbox
      uses: jetify-com/devbox-install-action@v0.13.0
      with:
        enable-cache: 'true'
        # Should match version from .envrc
        devbox-version: '0.13.7' # Setting a version is required to make the devbox fully cached.
    - name: Load devbox via direnv
      uses: HatsuneMiku3939/direnv-action@v1

    - name: Check xdebug config
      shell: bash
      run: |
        if ! php --info | grep 'xdebug.mode => no value => no value'; then
          echo 'Error: xdebug.mode should not be set in CI. Have you committed xdebug config by accident? Check devbox.d/php/php.ini'
          exit 1
        fi

    - name: Get Playwright version
      shell: bash
      run: |
        PLAYWRIGHT_VERSION=$(node -p "require('./packages/ui/package.json').devDependencies['@playwright/test'] || require('./tests/e2e/package.json').devDependencies['@playwright/test']")
        echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_ENV

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: /tmp/cache
        key: |
          cache-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/composer.lock') }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
        restore-keys: |
          cache-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/composer.lock') }}-playwright-
          cache-${{ hashFiles('**/pnpm-lock.yaml') }}-
          cache-
    - name: Set composer cache dir
      run: composer config --global cache-files-dir /tmp/cache/composer
      shell: bash
    - name: Set pnpm cache dir
      run: pnpm config set store-dir /tmp/cache/pnpm
      shell: bash
    - name: Set Playwright browsers dir
      run:
        echo "PLAYWRIGHT_BROWSERS_PATH=/tmp/cache/playwright-browsers" >>
        $GITHUB_ENV
      shell: bash

    - name: Install dependencies
      shell: bash
      run: pnpm i

    - name: Verify Playwright browser installation
      shell: bash
      run: |
        BROWSERS_INSTALLED=false
        if [ -d "/tmp/cache/playwright-browsers" ] && [ "$(ls -A /tmp/cache/playwright-browsers 2>/dev/null)" ]; then
          echo "Playwright browsers found in cache, verifying installation..."
          if command -v playwright &> /dev/null; then
            if playwright install --dry-run chromium 2>/dev/null; then
              echo "Browser verification successful"
              BROWSERS_INSTALLED=true
            else
              echo "Browser verification failed, will need fresh installation"
            fi
          fi
        else
          echo "No cached Playwright browsers found"
        fi
        echo "BROWSERS_INSTALLED=$BROWSERS_INSTALLED" >> $GITHUB_ENV

    - name: Install Playwright browsers
      shell: bash
      run: |
        if [ "$BROWSERS_INSTALLED" != "true" ]; then
          echo "Installing Playwright browsers..."
          cd tests/e2e
          playwright install chromium --with-deps
          echo "Playwright browsers installed successfully"
        else
          echo "Playwright browsers already available, skipping installation"
        fi
