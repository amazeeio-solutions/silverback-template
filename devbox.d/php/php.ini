# We keep the memory limit low for local development instead of using Lagoon's
# value.
memory_limit = 256M

# Xdebug.
xdebug.mode=off
# Uncomment this line to enable xdebug. And do NOT commit the change.
;xdebug.mode=debug
xdebug.start_with_request=yes
xdebug.output_dir=/tmp/xdebug
xdebug.profiler_output_name = cachegrind.out.%u

# Send emails to Mailpit.
# To open the UI:
#   http://localhost:8025
#
# -t -i for Symfony Mailer to work properly.
sendmail_path = "../../../.devbox/nix/profile/default/bin/mailpit sendmail -t -i"
