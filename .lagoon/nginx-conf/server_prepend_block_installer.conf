## Block the Drupal installer (SA-CORE-2026-019). The base image routes
## install.php to PHP; a server-level ^~ prefix wins over its regex locations.
## https://www.drupal.org/docs/administering-a-drupal-site/security-in-drupal/securing-the-installer-installphp
location ^~ /core/install.php {
  return 404;
}
location ^~ /install.php {
  return 404;
}
